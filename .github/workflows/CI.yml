# CI for LaMEM
# inspired by CI actions used in GEOS
#
name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  runs_on:
    name: 'Linux'
    strategy:
      matrix:
        ci:
        - cxx_compiler: g++-12
          c_compiler: gcc-12
          build_type: Release
          cxxstd: 20
          arch: 64
          packages: 'g++-12-multilib gcc-12-multilib'
          cmake: 3.22.*
          os: ubuntu-22.04

    runs-on: ${{ matrix.ci.os }}
    steps:

    - name: 'Install compilers'
      run: |
        set -e
        uname -a
        sudo -E apt-get update
        sudo -E apt-get -yq --no-install-suggests --no-install-recommends install make astyle ${{ matrix.ci.packages }}
        # Now create workspace directories, to later copy the pre-compiled PETSC libraries there
        sudo -E mkdir /workspace
        sudo -E mkdir /workspace/destdir
        
    - name: 'Install julia'
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.13'
        
    - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'

    - run: julia -e '@show Base.BinaryPlatforms.HostPlatform()'

    - name: 'Checkout LaMEM'
      uses: actions/checkout@v3

    - name: 'Install PETSc & LaMEM'
      run: |
        cd test
        julia --project=. setup_packages.jl
        cd ..

    - name: 'Check source formatting'
      run: |
        cd test
        julia --project=. compile_lamem.jl check
        cd ..

    - name: 'Compile LaMEM | Int32'
      run: |
        cd test
        julia --project=. compile_lamem.jl int32
        pwd
        # cleanup
        rm -rf ../lib/opt/*
        rm -rf ../lib/deb/*
        rm -rf ../dep/opt/*
        rm -rf ../dep/deb/*
        cd ../bin
        sudo -E mv -f opt opt32
        sudo -E mv -f deb deb32
        cd ..

    - name: 'Compile LaMEM | Int64'
      run: |
        cd test
        julia --project=. compile_lamem.jl int64
        cd ../bin
        sudo -E mv -f opt opt64
        sudo -E mv -f deb deb64
        cd ..

    - name: 'Build dylib plugin bundle (t40)'
      run: |
        julia --project=@juliac -e 'using Pkg; Pkg.add("JuliaC")'
        julia --project=@juliac scripts/dylib_plugins/build_plugin.jl scripts/dylib_plugins/ptlib_constant.jl test/t40_PhaseTransitionPlugin
        julia --project=@juliac scripts/dylib_plugins/build_plugin.jl scripts/dylib_plugins/ptlib_box.jl test/t40_PhaseTransitionPlugin
        test -f test/t40_PhaseTransitionPlugin/build_constant/lib/libptlib_constant.so
        test -f test/t40_PhaseTransitionPlugin/build_box/lib/libptlib_box.so

    - name: 'Test LaMEM | Int32'
      run: |
        cd bin
        sudo -E cp -r opt32 opt
        sudo -E cp -r deb32 deb
        cd ..
        julia --color=yes --depwarn=yes --inline=yes --project=. test/start_tests_CI.jl

    - name: 'Test LaMEM | Int64'
      run: |
        cd bin
        # rename directories
        sudo -E rm -rf opt
        sudo -E rm -rf deb
        
        sudo -E cp -r opt64 opt
        sudo -E cp -r deb64 deb
        
        cd ..
        julia --color=yes --depwarn=yes --inline=yes --project=. test/start_tests_CI.jl is64bit 
        
  windows_dylib_plugin:
    # Verifies the dylib_plugin loader's Windows-specific code path (see
    # src/dylib_plugins.cpp's #if defined(_WIN32) branches). Narrower than the
    # Linux job: it compiles LaMEM and runs one plugin test, not the full test
    # suite - LaMEM's general correctness on Windows is not otherwise in doubt,
    # only whether the plugin loader itself works there, which nothing else in
    # this workflow exercises.
    name: 'Windows (dylib_plugin)'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:

    - name: 'Checkout LaMEM'
      uses: actions/checkout@v4

    - name: 'Set up MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        # julia-actions/setup-julia adds julia to the Windows PATH (via $GITHUB_PATH);
        # the default path-type=minimal would hide that from this MSYS2 shell.
        path-type: inherit
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          make

    - name: 'Install julia'
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.13'
        arch: x64

    - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'

    - name: 'Mount /workspace/destdir over the real destdir'
      # PETSc_jll's lib/petsc/.../conf/variables file has an absolute
      # `include /workspace/destdir/.../petscvariables` line baked in at
      # Yggdrasil build time (BinaryBuilder's own sandbox path) - not
      # relocatable. Linux CI works today only because it also stages
      # everything under that exact literal path. Windows has no such
      # root, so give MSYS2 an /etc/fstab entry mapping the POSIX path
      # /workspace/destdir to our real, writable destdir - this is a
      # msys-2.0.dll-level mount, so it's honored by any MSYS2 binary
      # (make, mpicxx, ...) in later steps too, not just this shell.
      run: |
        D="$(cygpath -u '${{ github.workspace }}\lamem_destdir')"
        mkdir -p "$D"
        echo "$D /workspace/destdir none bind 0 0" >> /etc/fstab

    - name: 'Install PETSc & LaMEM'
      env:
        LAMEM_CI_DESTDIR: ${{ github.workspace }}\lamem_destdir
      run: |
        cd test
        julia --project=. setup_packages.jl
        cd ..

    - name: 'Compile LaMEM | Int64'
      env:
        LAMEM_CI_DESTDIR: ${{ github.workspace }}\lamem_destdir
      run: |
        cd test
        julia --project=. compile_lamem.jl int64
        cd ..
        ls bin/opt/

    - name: 'Build dylib plugin bundle'
      run: |
        julia --project=@juliac -e 'using Pkg; Pkg.add("JuliaC")'
        julia --project=@juliac scripts/dylib_plugins/build_plugin.jl scripts/dylib_plugins/ptlib_constant.jl test/t40_PhaseTransitionPlugin
        # JuliaC's Windows bundles are flat under <output_dir>/bin (no bin+lib
        # split like Unix), so the plugin DLL lands at build_constant/bin/,
        # not build_constant/lib/.
        test -f test/t40_PhaseTransitionPlugin/build_constant/bin/libptlib_constant.dll

    - name: 'Stage runtime DLLs next to LaMEM.exe'
      run: |
        # LaMEM.exe is linked with -Wl,-rpath for its runtime library dirs,
        # but Windows PE binaries don't honor rpath the way ELF does - DLLs
        # are found via the exe's own directory or PATH only. msmpi.dll and
        # PETSc's own shared libs live under /workspace/destdir/{bin,lib,...},
        # not next to LaMEM.exe, so copy them there (the Windows loader
        # always checks the exe's own directory first).
        cp /workspace/destdir/bin/*.dll bin/opt/ 2>/dev/null || true
        cp /workspace/destdir/bin/petsc/double_real_Int64/lib/*.dll bin/opt/ 2>/dev/null || true
        cp /workspace/destdir/lib/*.dll bin/opt/ 2>/dev/null || true
        cp /workspace/destdir/lib/fastscape/*.dll bin/opt/ 2>/dev/null || true
        # Do NOT stage libjulia*.dll or other Julia-runtime DLLs here: the
        # dylib_plugin loader (DylibPluginOpenWinDeps) explicitly opens its
        # OWN libjulia.dll from the plugin DLL's own directory
        # (test/t40_PhaseTransitionPlugin/build_constant/bin/), which is a
        # different Julia build/version than PETSc_jll's bundled one. A
        # second, different libjulia.dll sitting next to LaMEM.exe caused
        # "Image file failed consistency check" - remove it and its
        # LLVM/Julia-internal siblings so only the plugin's own copy exists.
        rm -f bin/opt/libjulia*.dll bin/opt/libLLVM*.dll bin/opt/libllvmcalltest.dll \
              bin/opt/libLTO.dll bin/opt/libccall*.dll bin/opt/libmlir_*.dll \
              bin/opt/libload_time_mpi_constants.dll bin/opt/libRemarks.dll
        ls bin/opt/msmpi.dll bin/opt/libfastscapelib_fortran.dll

    - name: 'Run LaMEM with the dylib plugin'
      # MSYS2's own exec path cannot launch native Windows executables in
      # this runner context at all - even cmd.exe itself fails the same way
      # under it (confirmed: "error while loading shared libraries:
      # api-ms-win-core-delayload-l1-1-0.dll", a virtual API Set DLL that
      # isn't a real file, resolved by the Windows kernel - not something
      # any file copy or PATH entry can fix). Run this one step through
      # PowerShell instead, overriding the job's msys2 shell default, since
      # running the already-built native .exe doesn't need MSYS2 at all.
      shell: pwsh
      run: |
        cd test/t40_PhaseTransitionPlugin
        $proc = Start-Process -FilePath "..\..\bin\opt\LaMEM.exe" -ArgumentList "-ParamFile","PT0_only_plugin.dat","-dylib_plugin","build_constant\bin\libptlib_constant.dll" -RedirectStandardOutput dylib_plugin_windows.log -RedirectStandardError dylib_plugin_windows.err.log -PassThru
        Start-Sleep -Seconds 3
        Write-Host "--- all libblastrampoline-5.dll modules loaded in the LaMEM.exe process ---"
        try {
            $modules = $proc.Modules | Where-Object { $_.ModuleName -ieq "libblastrampoline-5.dll" }
            foreach ($m in $modules) { Write-Host "$($m.FileName)  base=0x$($m.BaseAddress.ToString('X'))" }
            Write-Host "count: $($modules.Count)"
        } catch { Write-Host "could not enumerate modules: $_" }
        Wait-Process -Id $proc.Id -Timeout 300 -ErrorAction SilentlyContinue
        if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
        Get-Content dylib_plugin_windows.log
        Get-Content dylib_plugin_windows.err.log
        if ($proc.ExitCode -ne 0) { throw "LaMEM.exe exited with code $($proc.ExitCode)" }
        $log = Get-Content dylib_plugin_windows.log -Raw
        if ($log -notmatch "Dylib plugin") { throw "missing 'Dylib plugin' in output" }
        if ($log -notmatch "27512 marker\(s\) changed phase") { throw "missing '27512 marker(s) changed phase' in output" }
        if ($log -notmatch "SOLUTION IS DONE") { throw "missing 'SOLUTION IS DONE' in output" }

  build_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.10'
      - name: Install dependencies 1
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev        
      - name: Install dependencies 2
        run: julia --project=doc/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        run: DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' 
             julia --project=doc/ doc/make.jl
             
